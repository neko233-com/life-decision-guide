  <summary>本站核对：只有断续喘息也算异常呼吸</summary>
  <div class="tip-update-body">
    <p>成人叫不应又没有正常呼吸，包括只有断续喘息，应按心脏骤停处理，联系急救并立即开始胸外按压。不能因还能喘息就等待。</p>
    <p>AHA 2025成人基础生命支持指南明确了上述识别条件。尽快取用AED并按提示操作；婴儿手法另见<a href="#tip-13-44">本章第44条</a>。</p>
    <p class="tip-update-source">核对日期：2026-10-05 · <a href="https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/adult-basic-life-support" target="_blank" rel="noreferrer">AHA成人基础生命支持指南</a></p>
  </div>
</details>
