<details class="tip-update" data-updated="2026-10-05">
  <summary>本站核对：提前领取也有明确条件</summary>
  <div class="tip-update-body">
    <p>原文列举的领取情形不完整。2025年规则新增了符合条件的医疗支出、失业和低保情形，不是存入后一定要等到退休。</p>
    <p>新增条件包括：申请前12个月内，本人或配偶、未成年子女的医保目录内自付费用超过本省上年居民人均可支配收入；申请前2年内领失业保险金累计12个月；正在领取城乡低保。</p>
    <p>具体认定、税款和产品赎回规则，向社保经办机构与开户银行核对；应急资金仍应另备。</p>

  </div>
