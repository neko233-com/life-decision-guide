<details class="tip-update" data-updated="2026-10-05">
  <summary>本站核对：出生年份与申请期限要分开看</summary>
  <div class="tip-update-body">
    <p>补贴不只覆盖2025年及以后出生的孩子。2025年前出生且符合条件的3岁内婴幼儿，也有按月折算的补贴。</p>
    <p>按年度申请：2025年及以后出生者在出生当年或次年首次申请，再按规定续领。2025年前出生者的首次申请期限为2025-12-31；逾期视为放弃当年资格。</p>
    <p>2026年申请前，向户籍地核对首次或续领资格和当地规则；补贴不能代替完整育儿预算。</p>
    <p class="tip-update-source">核对日期：2026-10-05 · <a href="https://app.www.gov.cn/govdata/gov/202509/18/536944/article.html" target="_blank" rel="noreferrer">育儿补贴制度管理规范（试行）</a></p>
  </div>
</details>
